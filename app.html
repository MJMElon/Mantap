<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#166534">
<title>Mantap · Worker Portal</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="shared/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="shared/config.js"></script>
<script src="shared/i18n.js"></script>
<script src="shared/auth.js"></script>
<script src="shared/modules.js"></script>
<script>if (!WorkerSession.get()) location.replace('./');</script>
<style>
  body { min-height: 100vh; background: linear-gradient(160deg, #f0fdf4 0%, #e8f5e9 40%, #f8fafc 100%); }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); background: linear-gradient(90deg, #1b5e20, #2e7d32); color: #fff; }
  .bar .brand-sub { color: rgba(255,255,255,.75); }
  .bar .brand-mark { background: rgba(255,255,255,.18); width: 34px; height: 34px; font-size: 16px; }
  .bar .lang { border-color: rgba(255,255,255,.35); background: transparent; }
  .bar .lang button { color: rgba(255,255,255,.8); }
  .bar .lang button.on { background: #fff; color: var(--green); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .hello { font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  .name { font-size: 28px; font-weight: 800; margin: 0 0 6px; letter-spacing: -.3px; }
  .est { font-size: 13px; color: var(--green); font-weight: 600; margin: 0 0 24px; }
  .sect { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .mod { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px 14px; border-radius: 18px; background: #fff; border: 1px solid #dcfce7; box-shadow: 0 2px 10px rgba(15,23,42,.05); text-decoration: none; color: inherit; }
  .mod:active { transform: scale(.98); }
  .mod-icon { width: 50px; height: 50px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .mod-name { font-weight: 700; font-size: 16px; }
  .mod-desc { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .empty { background: #fff; border: 1px dashed var(--line); border-radius: 14px; padding: 20px; color: var(--muted); font-size: 14px; }
  .out { margin-top: 32px; width: 100%; }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <div class="brand-mark">M</div>
    <div><div class="brand-name">Mantap</div><div class="brand-sub" data-i18n="portal">Worker Portal</div></div>
  </div>
  <div class="lang"><button data-lang="en" onclick="setLang('en')">EN</button><button data-lang="ms" onclick="setLang('ms')">BM</button></div>
</header>
<main class="wrap">
  <p class="hello" data-i18n="welcome">Welcome</p>
  <h1 class="name" id="who">—</h1>
  <p class="est" id="est"></p>
  <p class="sect" data-i18n="modules">Modules</p>
  <div class="grid" id="mods"></div>
  <button class="btn out" onclick="doSignOut()" data-i18n="sign_out">Sign out</button>
</main>
<script>
  function render(s) {
    if (!s) return;
    const lang = getLang();
    document.getElementById('who').textContent = s.name || '—';
    document.getElementById('est').textContent = (s.estates || []).length ? '🌴 ' + s.estates.join(', ') : '';
    const mods = MODULES.filter(m => m.allowed(s));
    document.getElementById('mods').innerHTML = mods.length ? mods.map(m =>
      '<a class="mod" href="' + m.url + '">' +
        '<span class="mod-icon" style="background:' + m.color + '1f">' + m.icon + '</span>' +
        '<span class="mod-name">' + escapeHtml(m.name[lang]) + '</span>' +
        '<span class="mod-desc">' + escapeHtml(m.desc[lang]) + '</span>' +
      '</a>').join('')
      : '<div class="empty" style="grid-column:1/-1">' + escapeHtml(t('no_modules')) + '</div>';
  }
  function doSignOut() {
    if (!confirm(t('sign_out_q'))) return;
    signOutWorker();
    location.replace('./');
  }
  window.onLangChange = () => render(WorkerSession.get());
  applyI18n();
  render(WorkerSession.get());
  // Pick up permission / estate / status changes made by the admin.
  refreshWorker().then(s => s ? render(s) : location.replace('./?inactive=1'));
</script>
</body>
</html>
