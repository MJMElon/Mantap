<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#166534">
<title>Mantap · Worker Portal</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="shared/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="shared/config.js"></script>
<script src="shared/i18n.js"></script>
<script src="shared/auth.js"></script>
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: linear-gradient(160deg, #f0fdf4 0%, #f8fafc 50%, #ecfdf5 100%); }
  .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 24px; box-shadow: 0 10px 30px rgba(15, 23, 42, .06); }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .field { margin-bottom: 14px; }
  .btn.primary { width: 100%; padding: 13px; font-size: 16px; margin-top: 6px; }
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div><div class="brand-name">Mantap</div><div class="brand-sub" data-i18n="portal">Worker Portal</div></div>
    </div>
    <div class="lang"><button data-lang="en" onclick="setLang('en')">EN</button><button data-lang="ms" onclick="setLang('ms')">BM</button></div>
  </div>
  <h1 data-i18n="login_title">Sign in</h1>
  <p class="sub" data-i18n="login_sub">Use your User ID and password.</p>
  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label class="label" for="uid" data-i18n="user_id">User ID</label>
      <input class="input" id="uid" autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>
    <div class="field">
      <label class="label" for="pw" data-i18n="password">Password</label>
      <input class="input" id="pw" type="password" autocomplete="current-password">
    </div>
    <button class="btn primary" id="loginBtn" type="submit" data-i18n="sign_in">Sign In</button>
    <p class="err" id="loginErr"></p>
  </form>
</main>
<script>
  // ?demo=1 is the admin's Mobile Demo: show the worker side even when an admin is signed in.
  const IS_DEMO = new URLSearchParams(location.search).has('demo') || window.self !== window.top;

  if (WorkerSession.get()) location.replace('app.html');
  else if (!IS_DEMO && AdminSession.get()) location.replace('admin.html');

  applyI18n();
  if (new URLSearchParams(location.search).get('inactive')) document.getElementById('loginErr').textContent = t('err_inactive');

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn'), err = document.getElementById('loginErr');
    err.textContent = '';
    btn.disabled = true; btn.textContent = t('signing_in');
    try {
      const r = await signIn(document.getElementById('uid').value, document.getElementById('pw').value);
      if (r.kind === 'admin' && IS_DEMO) { err.textContent = t('err_not_worker'); return; }
      location.replace(r.kind === 'admin' ? 'admin.html' : 'app.html');
    } catch (ex) {
      console.error(ex);
      err.textContent = t(I18N.en[ex.message] ? ex.message : 'err_network');
    } finally {
      btn.disabled = false; btn.textContent = t('sign_in');
    }
  });
</script>
</body>
</html>
